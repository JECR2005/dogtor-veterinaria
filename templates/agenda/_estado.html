{# Estado de la cita con texto, icono y color (RI-02: nunca solo color) #}
{% if estado == "Programada" %}<span class="dg-estado text-primary"><i class="bi bi-clock" aria-hidden="true"></i> Programada</span>
{% elif estado == "Completada" %}<span class="dg-estado text-success"><i class="bi bi-check-circle" aria-hidden="true"></i> Completada</span>
{% else %}<span class="dg-estado text-secondary"><i class="bi bi-x-circle" aria-hidden="true"></i> Cancelada</span>{% endif %}
