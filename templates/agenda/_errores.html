{% if formulario.non_field_errors %}
  <div class="alert alert-danger d-flex gap-2" role="alert">
    <i class="bi bi-x-octagon" aria-hidden="true"></i>
    <span>{% for error in formulario.non_field_errors %}<strong>{{ error }}</strong>{% if not forloop.last %}<br>{% endif %}{% endfor %}. No se guardó la cita.</span>
  </div>
{% elif formulario.errors %}
  <div class="alert alert-danger d-flex gap-2" role="alert"><i class="bi bi-x-octagon" aria-hidden="true"></i><span>No se guardó. Corrija los campos marcados en rojo.</span></div>
{% endif %}
