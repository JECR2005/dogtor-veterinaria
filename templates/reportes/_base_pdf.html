<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <title>{% block titulo %}Dogtor{% endblock %}</title>
  <style>
    @page { size: letter; margin: 2cm 1.8cm; }
    body { font-family: Helvetica, Arial, sans-serif; font-size: 10.5pt; color: #222; }
    h1 { font-size: 15pt; margin: 0 0 4pt 0; }
    .encabezado { border-bottom: 1.5pt solid #0d6efd; padding-bottom: 6pt; margin-bottom: 10pt; }
    .marca { font-size: 13pt; font-weight: bold; color: #0d6efd; }
    .tenue { color: #666; font-size: 9pt; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; border-bottom: 1pt solid #999; padding: 3pt 4pt; font-size: 9.5pt; }
    td { border-bottom: 0.5pt solid #ddd; padding: 3pt 4pt; vertical-align: top; }
    {% block estilos %}{% endblock %}
  </style>
</head>
<body>
  {# D-18 · Plantilla base de los documentos PDF tamaño carta (receta en P3; ticket y corte en P4) #}
  <div class="encabezado">
    <span class="marca">Dogtor: Veterinaria &amp; Petcare</span><br>
    <span class="tenue">{% block subtitulo %}{% endblock %}</span>
  </div>
  {% block contenido %}{% endblock %}
</body>
</html>
