{# Estado del ticket con texto, icono y color (RI-02: nunca solo color) #}
{% if estado == "Pagada" %}<span class="dg-estado text-success"><i class="bi bi-check-circle" aria-hidden="true"></i> Pagada</span>
{% elif estado == "Pendiente" %}<span class="dg-estado text-warning-emphasis"><i class="bi bi-hourglass-split" aria-hidden="true"></i> Pendiente</span>
{% else %}<span class="dg-estado text-secondary"><i class="bi bi-x-circle" aria-hidden="true"></i> Cancelada</span>{% endif %}
