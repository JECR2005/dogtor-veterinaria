# S1-15 · Copia Bootstrap, Bootstrap Icons y FullCalendar a static/vendor/ (R07: funcionar sin internet).
# Corre solo en ramas de trabajo cuando cambia el script (o a mano) y sube los archivos a esa misma rama.
# Nunca sobre main ni develop: esas reciben los archivos por pull request.
name: Traer componentes

on:
  workflow_dispatch:
  push:
    branches-ignore: [main, develop]
    paths:
      - scripts/traer_componentes.sh
      - .github/workflows/traer-componentes.yml

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    if: github.ref_name != 'main' && github.ref_name != 'develop'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Descargar los paquetes de npm y copiarlos a static/vendor
        run: bash scripts/traer_componentes.sh

      - name: Subir los archivos a la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/vendor
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "S1-15: Bootstrap, Bootstrap Icons y FullCalendar en static/vendor (R07)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
