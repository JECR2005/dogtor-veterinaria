# S0-18 · Integración continua: en cada pull request se levanta SQL Server 2022, se revisan las
# migraciones y el estilo, y se ejecutan las pruebas con cobertura (Tabla 4.11, "Automatización").
# Las pruebas crean test_Dogtor y le aplican bd/01_tablas.sql y bd/02_vistas.sql (tests/conftest.py).
# El nombre del trabajo («pruebas») es el que exigen las reglas de protección de main y develop.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:   # permite ejecutarla a mano desde la pestaña Actions

jobs:
  pruebas:
    name: pruebas
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Dogtor_CI_2026!
          MSSQL_COLLATION: Modern_Spanish_CI_AS
        ports: ["1433:1433"]

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DB_NOMBRE: Dogtor
      DB_HOST: localhost
      DB_PUERTO: "1433"
      DB_USUARIO: sa
      DB_CONTRASENA: Dogtor_CI_2026!
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_CONFIAR_CERTIFICADO: si

    steps:
      - uses: actions/checkout@v4

      - name: Instalar ODBC Driver 18 y sqlcmd
        run: bash scripts/ci_instalar_odbc.sh

      - name: Esperar a SQL Server y crear la base
        run: |
          for i in $(seq 1 30); do
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DB_CONTRASENA" -C -Q "SELECT 1" && break
            sleep 2
          done
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$DB_CONTRASENA" -C -b \
            -Q "IF DB_ID(N'Dogtor') IS NULL CREATE DATABASE Dogtor COLLATE Modern_Spanish_CI_AS"

      - name: Validar los scripts T-SQL en una base limpia
        run: |
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $DB_CONTRASENA -C -b -I -d Dogtor"
          $SQLCMD -i bd/01_tablas.sql
          $SQLCMD -i bd/02_vistas.sql
          $SQLCMD -Q "SET NOCOUNT ON; IF (SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE='BASE TABLE') <> 26 THROW 50000, N'No se crearon 26 tablas', 1;"
          $SQLCMD -i bd/99_borrar_tablas.sql

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Estilo y análisis estático (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Revisión del proyecto Django
        run: python manage.py check

      - name: Migraciones incluidas en el PR
        run: python manage.py makemigrations --check --dry-run

      - name: Pruebas con cobertura (meta ≥ 60 %, Tabla 3.20)
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
          if-no-files-found: ignore
