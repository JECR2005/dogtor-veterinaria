# S5-12 · Nginx delante de Gunicorn: solo https, TLS 1.2 o 1.3 y cabeceras de seguridad (RNF-01, TS-03, D-25).
# El certificado lo genera mkcert en docker/certs (scripts/preparar_produccion.ps1); nunca va al repositorio.

server_tokens off;

upstream dogtor_web {
    server web:8000;
}

# http → https
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dogtor.local localhost 127.0.0.1;

    ssl_certificate     /etc/nginx/certs/dogtor.pem;
    ssl_certificate_key /etc/nginx/certs/dogtor-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 5m;

    # Cabeceras de seguridad para todo, también los estáticos. Las de Django se ocultan para no duplicarlas.
    # La política de contenido permite scripts y estilos en línea porque algunas pantallas los usan
    # (totales del ticket, calendario); todo lo demás solo puede venir del propio sitio.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    add_header Strict-Transport-Security "max-age=2592000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://dogtor_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
